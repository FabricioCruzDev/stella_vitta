services:
  db:
    image: postgres:16
    container_name: joias_db
    restart: always
    environment:
      # O Docker vai substituir pelos valores do seu arquivo .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: joias_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data: